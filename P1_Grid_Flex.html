<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .contenedor {
            display: grid;
            flex-direction: column;
            grid-template-columns: repeat(3,1fr);
        }
        .card {
            width: 80px;
            padding: 20px;
            margin: 10px;
        }
        .card-larga {
            grid-column: 3;
            grid-row: span 3;

            display: felx;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="card" style="background-color:rgb(56, 56, 200);">card</div>
        <div class="card" style="background-color:rgb(209, 12, 12);">card</div>
        <div class="card-larga" style="background-color:rgb(64, 161, 64);">card</div>
        <div class="card" style="background-color:rgb(180, 117, 1);">card</div>
        <div class="card" style="background-color:rgb(138, 7, 138);">card</div>
        <div class="card" style="background-color:rgb(175, 175, 61);">card</div>
        <div class="card" style="background-color:rgb(108, 18, 18);">card</div>

    </div>
</body>
</html>
